<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPI対策問題集</title>
<style>
  :root{
    --paper:#EFEAE0;
    --card:#FBF9F4;
    --ink:#212A38;
    --ink-soft:#5B6472;
    --red:#B23A2E;
    --gold:#9C7C38;
    --line:#D8D0BE;
    --green:#48602F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 34px, rgba(33,42,56,0.035) 34px, rgba(33,42,56,0.035) 35px);
    color:var(--ink);
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 80px;
  }
  .sheet{ width:100%; max-width:760px; }
  header{ text-align:center; margin-bottom:22px; position:relative; }
  header .eyebrow{ letter-spacing:0.35em; font-size:11px; color:var(--gold); font-weight:600; }
  header h1{
    font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
    font-size:28px; font-weight:600; margin:6px 0 4px; letter-spacing:0.06em;
  }
  header p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .ranking-header-btn{
    position:absolute; top:48px; right:0;
    background:var(--ink); color:#fff; border:none; border-radius:2px;
    padding:9px 16px; font-size:12px; font-weight:600; letter-spacing:0.05em;
    cursor:pointer; font-family:inherit;
  }
  .ranking-header-btn:hover{ background:#33415a; }
  @media(max-width:480px){
    .ranking-header-btn{ position:static; display:block; margin:0 auto 14px; }
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow:0 1px 0 var(--line), 0 12px 24px -18px rgba(33,42,56,0.4);
    padding:26px 22px;
    position:relative;
  }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--red); }

  /* ---- ログイン画面 ---- */
  .login-wrap{ text-align:center; padding:14px 4px 6px; }
  .login-wrap .lead{ font-size:13.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.8; }
  .nick-input{
    width:100%;
    padding:13px 14px;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:2px;
    background:#fff;
    font-family:inherit;
    margin-bottom:14px;
  }
  .nick-input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .enter-btn{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:2px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.15em;
    cursor:pointer;
  }
  .enter-btn:hover{ background:#33415a; }
  .login-note{ margin-top:12px; font-size:11.5px; color:var(--ink-soft); }
  .error-msg{ color:var(--red); font-size:12.5px; margin-top:8px; min-height:16px; }

  /* ---- メニュー画面 ---- */
  .user-bar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;
    border-bottom:1px solid var(--line); padding-bottom:12px;
  }
  .user-bar b{ color:var(--ink); font-size:14px; }
  .user-bar button{
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:2px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .analysis-box{
    background:#fff; border:1px solid var(--line); border-radius:2px;
    padding:14px 16px; margin-bottom:22px;
  }
  .analysis-title{
    font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--gold);
    margin-bottom:10px;
  }
  .analysis-empty{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .analysis-cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:480px){ .analysis-cols{ grid-template-columns:1fr; } }
  .analysis-col h4{ font-size:12px; margin:0 0 8px; color:var(--ink); }
  .analysis-col.strong h4::before{ content:"◎ "; color:var(--green); }
  .analysis-col.weak h4::before{ content:"△ "; color:var(--red); }
  .analysis-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; }
  .analysis-row span:last-child{ color:var(--ink-soft); }

  .random-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  @media(max-width:480px){ .random-row{ grid-template-columns:1fr; } }
  .random-btn{
    background:var(--ink); color:#fff; border:none; border-radius:2px;
    padding:14px; font-size:13.5px; font-weight:600; letter-spacing:0.05em; cursor:pointer; font-family:inherit;
  }
  .random-btn:hover{ background:#33415a; }
  .random-btn.nonlang{ background:var(--red); }
  .random-btn.nonlang:hover{ background:#932f25; }

  .group-title{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:14px; font-weight:700; color:var(--ink);
    margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:8px;
  }
  .group-title:first-of-type{ margin-top:0; }
  .group-title .tag{
    font-size:10px; color:#fff; background:var(--ink); padding:2px 7px; border-radius:2px; letter-spacing:0.05em;
  }
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:480px){ .cat-grid{ grid-template-columns:1fr; } }
  .cat-btn{
    text-align:left; background:#fff; border:1px solid var(--line); border-radius:2px;
    padding:12px 14px; cursor:pointer; font-family:inherit; color:var(--ink);
    transition:border-color .15s, transform .1s; position:relative;
  }
  .cat-btn:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .cat-btn .name{ font-size:14px; font-weight:600; }
  .cat-btn .desc{ display:block; font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .cat-btn .stat{ display:block; font-size:10.5px; color:var(--gold); margin-top:5px; }
  .cat-btn.heat-1{ background:#FCE8EC; border-color:#F3C4D0; }
  .cat-btn.heat-2{ background:#F8BFD0; border-color:#EF9AB4; }
  .cat-btn.heat-3{ background:#EE7FA0; border-color:#E15C85; }
  .cat-btn.heat-3 .name, .cat-btn.heat-3 .desc{ color:#fff; }
  .cat-btn.heat-3 .stat{ color:#fff0f4; }
  .cat-btn.heat-2:hover, .cat-btn.heat-3:hover, .cat-btn.heat-1:hover{ border-color:var(--ink); }

  /* ---- 出題画面 ---- */
  .quiz-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; font-size:12px; color:var(--ink-soft);
  }
  .quiz-head .cat-label{ font-weight:700; color:var(--ink); font-size:13px; }
  .progress-track{ height:4px; background:var(--line); border-radius:2px; margin-bottom:22px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--gold); transition:width .25s; }
  .q-number{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border:1.5px solid var(--ink); border-radius:50%;
    font-size:13px; font-weight:700; margin-right:8px;
  }
  .q-text{ font-size:16px; line-height:1.8; margin:14px 0 22px; white-space:pre-wrap; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border:1px solid var(--line); border-radius:2px; background:#fff; cursor:pointer;
    font-size:14px; text-align:left; font-family:inherit; color:var(--ink); width:100%;
  }
  .choice:hover{ border-color:var(--gold); }
  .choice .bubble{
    flex:0 0 22px; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--ink);
  }
  .choice.selected{ border-color:var(--ink); background:#EFF1EC; }
  .choice.selected .bubble{ background:var(--ink); color:#fff; }

  .nav-row{ display:flex; justify-content:space-between; margin-top:24px; align-items:center; }
  .nav-row-right{ display:flex; gap:10px; }
  .btn{ border:none; border-radius:2px; padding:11px 22px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:disabled{ background:#B9BEC6; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .select-warn{ font-size:11.5px; color:var(--red); margin-top:10px; min-height:14px; }

  /* ---- 結果画面 ---- */
  .result-wrap{ text-align:center; }
  .stamp{
    width:126px; height:126px; margin:6px auto 18px; border:3px solid var(--red); border-radius:50%;
    color:var(--red); display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-8deg); font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  }
  .stamp .score-num{ font-size:32px; font-weight:700; line-height:1; }
  .stamp .score-total{ font-size:12px; margin-top:2px; }
  .stamp .score-word{ font-size:12px; letter-spacing:0.2em; margin-top:4px; }
  .result-cat{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; }
  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:22px; }

  .review-list{ text-align:left; }
  .review-item{
    border:1px solid var(--line); border-radius:2px; background:#fff;
    padding:14px 16px; margin-bottom:10px;
  }
  .review-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .review-head .mark{
    flex:0 0 24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff;
  }
  .review-head .mark.ok{ background:var(--green); }
  .review-head .mark.ng{ background:var(--red); }
  .review-head .qlabel{ font-size:12px; color:var(--ink-soft); }
  .review-q{ font-size:13.5px; line-height:1.7; margin-bottom:8px; white-space:pre-wrap; }
  .review-ans{ font-size:12.5px; margin-bottom:6px; }
  .review-ans .you{ color:var(--ink-soft); }
  .review-exp{
    font-size:12.5px; line-height:1.7; color:var(--ink); background:var(--paper);
    border-radius:2px; padding:10px 12px; margin-top:6px;
  }

  /* ---- 模擬試験 ---- */
  .mock-wrap{ margin-bottom:22px; }
  .mock-btn{
    width:100%; background:var(--gold); color:#fff; border:none; border-radius:2px;
    padding:14px; font-size:14px; font-weight:700; letter-spacing:0.08em; cursor:pointer; font-family:inherit;
  }
  .mock-btn:hover{ background:#876a2d; }
  .mock-panel{ margin-top:10px; background:#fff; border:1px solid var(--line); border-radius:2px; padding:14px; }
  .mock-note{ font-size:11.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:10px; }
  .mock-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:480px){ .mock-grid{ grid-template-columns:1fr; } }
  .mock-opt{
    background:var(--card); border:1px solid var(--gold); color:var(--ink); border-radius:2px;
    padding:12px 10px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .mock-opt:hover{ background:#F3EAD3; }
  .mock-bar{
    position:sticky; top:0; z-index:10; background:var(--card);
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; margin:-6px 0 14px; border-bottom:1px solid var(--line);
  }
  .mock-timer{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); }
  .mock-timer.warn{ color:var(--red); }
  .mock-answered{ font-size:12px; color:var(--ink-soft); }
  .mock-info{ font-size:13px; line-height:1.9; color:var(--ink-soft); margin-bottom:18px; }
  .mock-timeup{ color:var(--red); font-weight:700; }
  .review-head .mark.na{ background:#9AA0A8; font-size:11px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <button class="ranking-header-btn" id="headerRankingBtn">ランキング</button>
    <div class="eyebrow">APTITUDE TEST PRACTICE</div>
    <h1>SPI対策問題集</h1>
    <p>ニックネームで記録しながら、弱点を見つけよう</p>
  </header>
  <div class="card" id="app"></div>
</div>

<script src="quiz_data.js"></script>
<script>
/* ========================= 問題データはquiz_data.jsで定義 ========================= */

/* カテゴリID→メタ情報 */
const CAT_META = {};
QUIZ_DATA.forEach(c=>{ CAT_META[c.id] = { name:c.name, group:c.group }; });

/* =========================================================
   オンライン同期設定(Firebase Realtime Database)
   ---------------------------------------------------------
   異なる端末でも同じニックネームの記録を見られるようにするには、
   下の DB_URL に Firebase Realtime Database の URL を設定してください。
   設定手順は導入ガイドを参照してください。
   未設定のままでも動作しますが、その場合は記録がこの端末(このブラウザ)
   だけに保存され、他の端末とは共有されません。
   ========================================================= */
const FIREBASE = {
  DB_URL: "https://practicespi-default-rtdb.asia-southeast1.firebasedatabase.app" // 例: "https://your-project-id-default-rtdb.firebaseio.com"
};

/* ========================= ストレージ ========================= */
const STORAGE_KEY = "spiAppData_v1";
const LAST_NICK_KEY = "spiAppLastNick_v1";

function loadDB(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveDB(db){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
}
function sanitizeKey(nickname){
  /* Firebaseのキーで実際に使用できない文字(. $ # [ ] /)のみを置換する。
     以前は"%"も置換対象に含めていたため、encodeURIComponent()による
     日本語のパーセントエンコードが壊れ、文字化けの原因になっていた。 */
  return encodeURIComponent(nickname.trim()).replace(/[.#$\[\]/]/g, "_");
}
function isOnlineSyncEnabled(){
  return !!FIREBASE.DB_URL;
}
async function fetchRemoteCategories(nickname){
  try{
    const key = sanitizeKey(nickname);
    const res = await fetch(`${FIREBASE.DB_URL}/students/${key}/categories.json`);
    if(!res.ok) return {};
    const data = await res.json();
    return data || {};
  }catch(e){ return {}; }
}
async function saveRemoteCategories(nickname, categories){
  try{
    const key = sanitizeKey(nickname);
    const res = await fetch(`${FIREBASE.DB_URL}/students/${key}.json`, {
      method:"PATCH",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ categories, nickname })
    });
    return res.ok;
  }catch(e){ return false; }
}
async function fetchAllStudents(){
  try{
    const res = await fetch(`${FIREBASE.DB_URL}/students.json`);
    if(!res.ok) return {};
    const data = await res.json();
    return data || {};
  }catch(e){ return {}; }
}
function decodeStudentKey(key){
  /* 旧バージョンのsanitizeKeyは"%"を"_"に置き換えていたため、
     日本語などのニックネームが「_E3_81...」のような形で壊れて保存されている場合がある。
     これは規則的な変換だったため、"_XX"(アンダースコア+16進数2桁)を
     "%XX"に戻してからデコードすれば、元のニックネームを復元できる。 */
  if(/(_[0-9A-Fa-f]{2}){2,}/.test(key)){
    try{
      const restored = key.replace(/_([0-9A-Fa-f]{2})/g, "%$1");
      return decodeURIComponent(restored);
    }catch(e){ /* 復元できなければ通常のデコードにフォールバック */ }
  }
  try{ return decodeURIComponent(key); }catch(e){ return key; }
}
/* 言語・非言語それぞれについて、30問以上解いたニックネームを正答率順に最大20名まで抽出する */
function computeGroupRankings(allStudents){
  const groups = { "言語": [], "非言語": [] };
  Object.keys(allStudents || {}).forEach(key=>{
    const entry = allStudents[key] || {};
    const nickname = entry.nickname || decodeStudentKey(key);
    const cats = entry.categories || {};
    const totals = { "言語": {attempted:0, correct:0}, "非言語": {attempted:0, correct:0} };
    Object.keys(cats).forEach(catId=>{
      const meta = CAT_META[catId];
      if(!meta) return;
      const s = cats[catId];
      totals[meta.group].attempted += s.attempted || 0;
      totals[meta.group].correct += s.correct || 0;
    });
    ["言語","非言語"].forEach(g=>{
      if(totals[g].attempted>=30){
        groups[g].push({
          nickname,
          attempted: totals[g].attempted,
          correct: totals[g].correct,
          pct: Math.round((totals[g].correct/totals[g].attempted)*100)
        });
      }
    });
  });
  ["言語","非言語"].forEach(g=>{
    groups[g].sort((a,b)=> b.pct-a.pct || b.attempted-a.attempted);
    groups[g] = groups[g].slice(0,20);
  });
  return groups;
}
/* 現在のカテゴリ別成績を取得する(オンライン同期が有効なら常にサーバーが正) */
async function getStats(nickname){
  if(isOnlineSyncEnabled()){
    const remote = await fetchRemoteCategories(nickname);
    const db = loadDB();
    db[nickname] = { categories: remote };
    saveDB(db); // オフライン閲覧用にローカルへもキャッシュ
    return remote;
  }
  const db = loadDB();
  return (db[nickname] && db[nickname].categories) || {};
}
async function recordResults(nickname, resultsArr){
  const current = await getStats(nickname);
  resultsArr.forEach(r=>{
    if(!current[r.catId]) current[r.catId] = { attempted:0, correct:0 };
    current[r.catId].attempted++;
    if(r.correct) current[r.catId].correct++;
  });
  const db = loadDB();
  db[nickname] = { categories: current };
  saveDB(db);
  if(isOnlineSyncEnabled()){
    await saveRemoteCategories(nickname, current);
  }
  return current;
}
function computeAnalysisFromCategories(cats){
  const arr = Object.keys(cats).map(id=>{
    const s = cats[id];
    return { id, name:(CAT_META[id]||{}).name || id, attempted:s.attempted, correct:s.correct, pct: Math.round((s.correct/s.attempted)*100) };
  }).filter(x=>x.attempted>0);
  const strong = arr.slice().sort((a,b)=> b.pct-a.pct || b.attempted-a.attempted).slice(0,3);
  const weak = arr.slice().sort((a,b)=> a.pct-b.pct || b.attempted-a.attempted).slice(0,3);
  return { hasData: arr.length>0, strong, weak };
}

/* ========================= アプリ本体 ========================= */
const app = document.getElementById("app");
let state = { nickname:"", questions:[], idx:0, answers:[], catLabel:"", mock:null, mockResult:null };

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function getHeatClass(attempted){
  if(attempted>=100) return "heat-3";
  if(attempted>=50) return "heat-2";
  if(attempted>=10) return "heat-1";
  return "";
}

/* ---- ログイン画面 ---- */
function renderLogin(){
  abortMock();
  const lastNick = localStorage.getItem(LAST_NICK_KEY) || "";
  app.innerHTML = `
    <div class="login-wrap">
      <p class="lead">ニックネームを入力すると、解いた問題の結果が記録され、<br>あなたの得意・不得意を分析できるようになります。</p>
      <input type="text" id="nickInput" class="nick-input" placeholder="ニックネームを入力" maxlength="20" value="${escapeHtml(lastNick)}">
      <button class="enter-btn" id="enterBtn">入る</button>
      <div class="error-msg" id="loginError"></div>
      <div class="login-note">※ 個人が特定できるニックネームの使用は避けてください</div>
    </div>
  `;
  const input = document.getElementById("nickInput");
  const btn = document.getElementById("enterBtn");
  const err = document.getElementById("loginError");
  function submit(){
    const val = input.value.trim();
    if(!val){ err.textContent = "ニックネームを入力してください。"; return; }
    state.nickname = val;
    localStorage.setItem(LAST_NICK_KEY, val);
    renderMenu();
  }
  btn.addEventListener("click", submit);
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  input.focus();
}

/* ---- メニュー画面 ---- */
async function renderMenu(){
  abortMock();
  app.innerHTML = `<div style="text-align:center; padding:50px 0; color:var(--ink-soft); font-size:13px;">読み込み中…</div>`;
  const categories = await getStats(state.nickname);
  const analysis = computeAnalysisFromCategories(categories);

  let analysisHtml = "";
  if(!analysis.hasData){
    analysisHtml = `<div class="analysis-empty">まだ記録がありません。問題を解くと、ここに得意・不得意な項目が表示されます。</div>`;
  } else {
    const row = x => `<div class="analysis-row"><span>${x.name}</span><span>${x.pct}%(${x.correct}/${x.attempted})</span></div>`;
    analysisHtml = `
      <div class="analysis-cols">
        <div class="analysis-col strong"><h4>得意な項目</h4>${analysis.strong.map(row).join("") || '<div class="analysis-empty">データ不足</div>'}</div>
        <div class="analysis-col weak"><h4>苦手な項目</h4>${analysis.weak.map(row).join("") || '<div class="analysis-empty">データ不足</div>'}</div>
      </div>`;
  }

  const syncNote = isOnlineSyncEnabled()
    ? "オンライン同期: 有効(どの端末でも同じ記録が見られます)"
    : "オンライン同期: 未設定(この端末のみに記録されます)";

  let html = `
    <div class="user-bar">
      <span>ニックネーム: <b>${escapeHtml(state.nickname)}</b><br><span style="font-size:10.5px;">${syncNote}</span></span>
      <button id="changeNickBtn">ニックネームを変更</button>
    </div>
    <div class="analysis-box">
      <div class="analysis-title">あなたの傾向</div>
      ${analysisHtml}
    </div>
    <div class="mock-wrap">
      <button class="mock-btn" id="mockToggleBtn">模擬試験</button>
      <div class="mock-panel hidden" id="mockPanel">
        <div class="mock-note">制限時間つきの模擬試験です。時間になると自動で終了し、採点されます。回答した問題は成績(得意・苦手の傾向やランキング)にも反映されます。</div>
        <div class="mock-grid">
          ${MOCK_EXAMS.map((e,i)=>`<button class="mock-opt" data-i="${i}">${mockLabel(e)}</button>`).join("")}
        </div>
      </div>
    </div>
    <div class="random-row">
      <button class="random-btn" id="randLang">言語ランダム(10問)</button>
      <button class="random-btn nonlang" id="randNonlang">非言語ランダム(10問)</button>
    </div>
  `;

  ["言語","非言語"].forEach(g=>{
    html += `<div class="group-title"><span class="tag">${g}</span>項目を選んでください</div><div class="cat-grid">`;
    QUIZ_DATA.filter(c=>c.group===g).forEach(c=>{
      const stat = categories[c.id];
      const attempted = stat ? stat.attempted : 0;
      const statHtml = stat ? `直近までの正答率 ${Math.round((stat.correct/stat.attempted)*100)}%(${stat.correct}/${stat.attempted}問)` : "";
      const heatClass = getHeatClass(attempted);
      html += `<button class="cat-btn ${heatClass}" data-cat="${c.id}">
        <span class="name">${c.name}</span>
        <span class="desc">${c.desc}</span>
        ${statHtml ? `<span class="stat">${statHtml}</span>` : ""}
      </button>`;
    });
    html += `</div>`;
  });

  app.innerHTML = html;

  document.getElementById("changeNickBtn").addEventListener("click", renderLogin);
  document.getElementById("mockToggleBtn").addEventListener("click", ()=>{
    document.getElementById("mockPanel").classList.toggle("hidden");
  });
  app.querySelectorAll(".mock-opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const e = MOCK_EXAMS[parseInt(btn.dataset.i)];
      if(confirm(`${mockLabel(e)}を開始します。\n制限時間は${e.minutes}分です。開始するとすぐに時間が進みます。よろしいですか?`)){
        startMock(parseInt(btn.dataset.i));
      }
    });
  });
  document.getElementById("randLang").addEventListener("click", ()=>startQuiz({ group:"言語", random:true }));
  document.getElementById("randNonlang").addEventListener("click", ()=>startQuiz({ group:"非言語", random:true }));
  app.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>startQuiz({ catId: btn.dataset.cat }));
  });
}

/* ---- 模擬試験 ---- */
const MOCK_EXAMS = [
  { group:"言語",   minutes:6,  count:20 },
  { group:"言語",   minutes:12, count:40 },
  { group:"非言語", minutes:10, count:10 },
  { group:"非言語", minutes:20, count:20 }
];
function mockLabel(e){ return `模擬試験　${e.group} ${e.minutes}分${e.count}問`; }

const MOCK_SEEN_KEY = "spiMockSeen_v1";
function loadMockSeen(){
  try{ return JSON.parse(localStorage.getItem(MOCK_SEEN_KEY)) || {}; }catch(e){ return {}; }
}
function saveMockSeen(obj){
  try{ localStorage.setItem(MOCK_SEEN_KEY, JSON.stringify(obj)); }catch(e){}
}
function hashStr(s){
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h<<5)+h+s.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}
function formatMMSS(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* 分野内の全問題から、そのニックネームがまだ模擬試験で出会っていない問題を優先して出題する。
   全問題を出し切ったら履歴をリセットして次の周回に入る。 */
function pickMockQuestions(group, count){
  const pool = [];
  QUIZ_DATA.filter(c=>c.group===group).forEach(c=>{
    c.questions.forEach(q=> pool.push({ ...q, catId:c.id, catName:c.name, uid:hashStr(c.id+"|"+q.q) }));
  });
  const all = loadMockSeen();
  const userSeen = (all[state.nickname] && all[state.nickname][group]) || [];
  const seenSet = new Set(userSeen);
  const unseen = pool.filter(p=>!seenSet.has(p.uid));
  const seen = pool.filter(p=>seenSet.has(p.uid));
  let picked, newSeen;
  if(unseen.length >= count){
    picked = shuffle(unseen).slice(0, count);
    newSeen = userSeen.concat(picked.map(p=>p.uid));
  } else {
    const fill = shuffle(seen).slice(0, count - unseen.length);
    picked = unseen.concat(fill);
    newSeen = fill.map(p=>p.uid);
  }
  all[state.nickname] = all[state.nickname] || {};
  all[state.nickname][group] = newSeen;
  saveMockSeen(all);
  return shuffle(picked);
}

function mockRemainingSec(){
  if(!state.mock) return 0;
  return Math.max(0, Math.ceil((state.mock.endAt - Date.now())/1000));
}
function mockExpired(){
  return !!state.mock && Date.now() >= state.mock.endAt;
}
function stopMockTimer(){
  if(state.mock && state.mock.timerId){ clearInterval(state.mock.timerId); state.mock.timerId = null; }
}
function abortMock(){
  stopMockTimer();
  state.mock = null;
}
function tickMock(){
  if(!state.mock) return;
  const remain = mockRemainingSec();
  const el = document.getElementById("mockTimer");
  if(el){
    el.textContent = "残り " + formatMMSS(remain);
    el.classList.toggle("warn", remain <= 60);
  }
  if(mockExpired()) finishMock(true);
}
function startMock(i){
  abortMock();
  const exam = MOCK_EXAMS[i];
  const picked = pickMockQuestions(exam.group, exam.count);
  const now = Date.now();
  state.questions = picked;
  state.idx = 0;
  state.answers = new Array(picked.length).fill(null);
  state.catLabel = mockLabel(exam);
  state.mockResult = null;
  state.mock = {
    label: state.catLabel,
    limitSec: exam.minutes*60,
    startAt: now,
    endAt: now + exam.minutes*60*1000,
    timerId: null,
    finishing: false
  };
  renderQuiz();
  state.mock.timerId = setInterval(tickMock, 250);
}
async function finishMock(timedOut){
  if(!state.mock || state.mock.finishing) return;
  state.mock.finishing = true;
  stopMockTimer();
  const m = state.mock;
  const usedSec = timedOut ? m.limitSec : Math.min(m.limitSec, Math.round((Date.now()-m.startAt)/1000));
  state.answers = state.questions.map((q,i)=> state.answers[i] || {
    q:q.q, choices:q.choices, chosen:null, correctIndex:q.answer,
    correct:false, catId:q.catId, catName:q.catName, exp:q.exp
  });
  const answered = state.answers.filter(a=>a.chosen !== null);
  state.mockResult = {
    label: m.label, limitSec: m.limitSec, usedSec, timedOut,
    unanswered: state.answers.length - answered.length
  };
  app.innerHTML = `<div style="text-align:center; padding:50px 0; color:var(--ink-soft); font-size:13px;">${timedOut ? "時間切れです。採点しています…" : "採点しています…"}</div>`;
  if(answered.length > 0){
    await recordResults(state.nickname, answered.map(a=>({ catId:a.catId, correct:a.correct })));
  }
  state.mock = null;
  renderResult();
}

/* ---- 出題開始 ---- */
function startQuiz(opts){
  abortMock();
  state.mockResult = null;
  let pool = [];
  let label = "";
  if(opts.random){
    QUIZ_DATA.filter(c=>c.group===opts.group).forEach(c=>{
      c.questions.forEach(q=> pool.push({ ...q, catId:c.id, catName:c.name }));
    });
    pool = shuffle(pool).slice(0,10);
    label = opts.group + "(ランダム)";
  } else {
    const cat = QUIZ_DATA.find(c=>c.id===opts.catId);
    pool = shuffle(cat.questions.map(q=>({ ...q, catId:cat.id, catName:cat.name }))).slice(0,10);
    label = cat.name;
  }
  state.questions = pool;
  state.idx = 0;
  state.answers = new Array(pool.length).fill(null);
  state.catLabel = label;
  renderQuiz();
}

/* ---- 出題画面 ---- */
function renderQuiz(){
  const total = state.questions.length;
  const q = state.questions[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const isLast = state.idx === total-1;
  const isFirst = state.idx === 0;
  const existing = state.answers[state.idx];
  const isMock = !!state.mock;
  const answeredCount = () => state.answers.filter(Boolean).length;

  const mockBarHtml = isMock ? `
    <div class="mock-bar">
      <span class="mock-timer${mockRemainingSec() <= 60 ? ' warn' : ''}" id="mockTimer">残り ${formatMMSS(mockRemainingSec())}</span>
      <span class="mock-answered" id="mockAnswered">回答済み ${answeredCount()} / ${total}</span>
    </div>` : "";

  app.innerHTML = `
    ${mockBarHtml}
    <div class="quiz-head">
      <span class="cat-label">${escapeHtml(state.catLabel)}</span>
      <span>${state.idx+1} / ${total} 問</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div><span class="q-number">${state.idx+1}</span></div>
    <div class="q-text">${escapeHtml(q.q)}</div>
    <div class="choices" id="choices">
      ${q.choices.map((c,i)=>`
        <button class="choice${existing && existing.chosen===i ? ' selected' : ''}" data-i="${i}">
          <span class="bubble">${["A","B","C","D"][i]}</span>
          <span>${escapeHtml(c)}</span>
        </button>`).join("")}
    </div>
    <div class="select-warn" id="selectWarn"></div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="quitBtn">${isMock ? "中止する" : "メニューに戻る"}</button>
      <div class="nav-row-right">
        ${isFirst ? "" : `<button class="btn btn-ghost" id="prevBtn">前へ</button>`}
        <button class="btn btn-primary" id="nextBtn">${isLast ? "回答を終了" : "次へ"}</button>
      </div>
    </div>
  `;

  let chosen = existing ? existing.chosen : null;
  const choiceBtns = app.querySelectorAll(".choice");
  choiceBtns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(isMock && mockExpired()){ finishMock(true); return; }
      chosen = parseInt(btn.dataset.i);
      choiceBtns.forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      document.getElementById("selectWarn").textContent = "";
      saveCurrentAnswer();   // 選んだ時点で保存(時間切れで強制終了されても反映されるように)
      if(isMock){
        const el = document.getElementById("mockAnswered");
        if(el) el.textContent = `回答済み ${answeredCount()} / ${total}`;
      }
    });
  });

  function saveCurrentAnswer(){
    if(chosen === null) return;
    state.answers[state.idx] = {
      q: q.q, choices:q.choices, chosen, correctIndex:q.answer,
      correct: chosen === q.answer, catId:q.catId, catName:q.catName, exp:q.exp
    };
  }

  if(!isFirst){
    document.getElementById("prevBtn").addEventListener("click", ()=>{
      if(isMock && mockExpired()){ finishMock(true); return; }
      saveCurrentAnswer();
      state.idx--;
      renderQuiz();
    });
  }

  document.getElementById("nextBtn").addEventListener("click", async (e)=>{
    if(isMock){
      if(mockExpired()){ finishMock(true); return; }
      saveCurrentAnswer();
      if(isLast){
        const unanswered = total - answeredCount();
        if(unanswered > 0 && !confirm(`未回答の問題が${unanswered}問あります。このまま終了して採点しますか?`)) return;
        e.target.disabled = true;
        e.target.textContent = "採点しています…";
        await finishMock(false);
      } else {
        state.idx++; renderQuiz();   // 模擬試験では未回答のまま次へ進める
      }
      return;
    }
    if(chosen === null){
      document.getElementById("selectWarn").textContent = "選択肢を選んでください。";
      return;
    }
    saveCurrentAnswer();
    if(isLast){
      e.target.disabled = true;
      e.target.textContent = "採点しています…";
      await finishQuiz();
    } else {
      state.idx++; renderQuiz();
    }
  });

  document.getElementById("quitBtn").addEventListener("click", ()=>{
    if(isMock){
      if(!confirm("模擬試験を中止してメニューに戻りますか?(この模擬試験の結果は記録されません)")) return;
      abortMock();
    }
    renderMenu();
  });
}

async function finishQuiz(){
  await recordResults(state.nickname, state.answers.map(a=>({ catId:a.catId, correct:a.correct })));
  renderResult();
}

/* ---- 結果画面 ---- */
function renderResult(){
  const total = state.answers.length;
  const correctCount = state.answers.filter(a=>a.correct).length;
  const mr = state.mockResult;
  const isMock = !!mr;
  const showCat = isMock || state.catLabel.indexOf("ランダム") > -1;

  const mockInfoHtml = isMock ? `
    <div class="mock-info">
      ${mr.timedOut ? '<div class="mock-timeup">時間切れのため終了し、採点しました</div>' : ''}
      <div>制限時間 ${formatMMSS(mr.limitSec)} ／ 所要時間 ${formatMMSS(mr.usedSec)}</div>
      <div>回答 ${total - mr.unanswered}問 ／ 未回答 ${mr.unanswered}問 ／ 正答率 ${Math.round(correctCount/total*100)}%</div>
    </div>` : "";

  app.innerHTML = `
    <div class="result-wrap">
      <div class="stamp">
        <div class="score-num">${correctCount}<span style="font-size:16px">/${total}</span></div>
        <div class="score-word">CHECKED</div>
      </div>
      <div class="result-cat">「${escapeHtml(state.catLabel)}」正解数 ${correctCount}/${total}</div>
      ${mockInfoHtml}
      <div class="result-actions">
        <button class="btn btn-primary" id="backMenuBtn">メニューに戻る</button>
      </div>
      <div class="review-list">
        ${state.answers.map((a,i)=>{
          const unanswered = a.chosen === null;
          return `
          <div class="review-item">
            <div class="review-head">
              <span class="mark ${unanswered ? 'na' : (a.correct ? 'ok' : 'ng')}">${unanswered ? '未' : (a.correct ? '○' : '×')}</span>
              <span class="qlabel">問${i+1}${showCat ? "（"+escapeHtml(a.catName)+"）" : ""}</span>
            </div>
            <div class="review-q">${escapeHtml(a.q)}</div>
            <div class="review-ans">
              <span class="you">あなたの回答: ${unanswered ? "未回答" : ["A","B","C","D"][a.chosen] + ". " + escapeHtml(a.choices[a.chosen])}</span><br>
              正解: ${["A","B","C","D"][a.correctIndex]}. ${escapeHtml(a.choices[a.correctIndex])}
            </div>
            <div class="review-exp">${escapeHtml(a.exp)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;

  document.getElementById("backMenuBtn").addEventListener("click", renderMenu);
}

/* ---- ランキング画面 ---- */
async function renderRanking(){
  app.innerHTML = `<div style="text-align:center; padding:50px 0; color:var(--ink-soft); font-size:13px;">読み込み中…</div>`;

  const backTo = state.nickname ? renderMenu : renderLogin;

  if(!isOnlineSyncEnabled()){
    app.innerHTML = `
      <div class="login-wrap">
        <p class="lead">ランキング機能を利用するには、オンライン同期(Firebase)の設定が必要です。</p>
        <button class="btn btn-ghost" id="backBtn" style="width:100%;">戻る</button>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", backTo);
    return;
  }

  const allStudents = await fetchAllStudents();
  const groups = computeGroupRankings(allStudents);

  function renderList(list){
    if(list.length===0) return `<div class="analysis-empty">30問以上解いた人がまだいません。</div>`;
    return list.map((x,i)=>`
      <div class="analysis-row">
        <span>${i+1}位　${escapeHtml(x.nickname)}</span>
        <span>${x.pct}%(${x.correct}/${x.attempted})</span>
      </div>`).join("");
  }

  app.innerHTML = `
    <div class="user-bar">
      <span><b>ランキング</b><br><span style="font-size:10.5px;">各分野で30問以上解いた人が対象・正答率順に最大20名</span></span>
      <button id="backBtn">戻る</button>
    </div>
    <div class="analysis-box">
      <div class="analysis-title">言語 正答率ランキング</div>
      ${renderList(groups["言語"])}
    </div>
    <div class="analysis-box">
      <div class="analysis-title">非言語 正答率ランキング</div>
      ${renderList(groups["非言語"])}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", backTo);
}
document.getElementById("headerRankingBtn").addEventListener("click", ()=>{
  if(state.mock && !confirm("模擬試験の途中です。中止してランキングを表示しますか?(この模擬試験の結果は記録されません)")) return;
  abortMock();
  renderRanking();
});
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tickMock(); });

renderLogin();
</script>
