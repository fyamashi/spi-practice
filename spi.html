<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPI対策問題集</title>
<style>
  :root{
    --paper:#EFEAE0;
    --card:#FBF9F4;
    --ink:#212A38;
    --ink-soft:#5B6472;
    --red:#B23A2E;
    --gold:#9C7C38;
    --line:#D8D0BE;
    --green:#48602F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 34px, rgba(33,42,56,0.035) 34px, rgba(33,42,56,0.035) 35px);
    color:var(--ink);
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 80px;
  }
  .sheet{ width:100%; max-width:760px; }
  header{ text-align:center; margin-bottom:22px; }
  header .eyebrow{ letter-spacing:0.35em; font-size:11px; color:var(--gold); font-weight:600; }
  header h1{
    font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
    font-size:28px; font-weight:600; margin:6px 0 4px; letter-spacing:0.06em;
  }
  header p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow:0 1px 0 var(--line), 0 12px 24px -18px rgba(33,42,56,0.4);
    padding:26px 22px;
    position:relative;
  }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--red); }

  /* ---- ログイン画面 ---- */
  .login-wrap{ text-align:center; padding:14px 4px 6px; }
  .login-wrap .lead{ font-size:13.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.8; }
  .nick-input{
    width:100%;
    padding:13px 14px;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:2px;
    background:#fff;
    font-family:inherit;
    margin-bottom:14px;
  }
  .nick-input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .enter-btn{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:2px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.15em;
    cursor:pointer;
  }
  .enter-btn:hover{ background:#33415a; }
  .login-note{ margin-top:12px; font-size:11.5px; color:var(--ink-soft); }
  .error-msg{ color:var(--red); font-size:12.5px; margin-top:8px; min-height:16px; }

  /* ---- メニュー画面 ---- */
  .user-bar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;
    border-bottom:1px solid var(--line); padding-bottom:12px;
  }
  .user-bar b{ color:var(--ink); font-size:14px; }
  .user-bar button{
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:2px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .analysis-box{
    background:#fff; border:1px solid var(--line); border-radius:2px;
    padding:14px 16px; margin-bottom:22px;
  }
  .analysis-title{
    font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--gold);
    margin-bottom:10px;
  }
  .analysis-empty{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .analysis-cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:480px){ .analysis-cols{ grid-template-columns:1fr; } }
  .analysis-col h4{ font-size:12px; margin:0 0 8px; color:var(--ink); }
  .analysis-col.strong h4::before{ content:"◎ "; color:var(--green); }
  .analysis-col.weak h4::before{ content:"△ "; color:var(--red); }
  .analysis-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; }
  .analysis-row span:last-child{ color:var(--ink-soft); }

  .random-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  @media(max-width:480px){ .random-row{ grid-template-columns:1fr; } }
  .random-btn{
    background:var(--ink); color:#fff; border:none; border-radius:2px;
    padding:14px; font-size:13.5px; font-weight:600; letter-spacing:0.05em; cursor:pointer; font-family:inherit;
  }
  .random-btn:hover{ background:#33415a; }
  .random-btn.nonlang{ background:var(--red); }
  .random-btn.nonlang:hover{ background:#932f25; }

  .group-title{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:14px; font-weight:700; color:var(--ink);
    margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:8px;
  }
  .group-title:first-of-type{ margin-top:0; }
  .group-title .tag{
    font-size:10px; color:#fff; background:var(--ink); padding:2px 7px; border-radius:2px; letter-spacing:0.05em;
  }
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:480px){ .cat-grid{ grid-template-columns:1fr; } }
  .cat-btn{
    text-align:left; background:#fff; border:1px solid var(--line); border-radius:2px;
    padding:12px 14px; cursor:pointer; font-family:inherit; color:var(--ink);
    transition:border-color .15s, transform .1s; position:relative;
  }
  .cat-btn:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .cat-btn .name{ font-size:14px; font-weight:600; }
  .cat-btn .desc{ display:block; font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .cat-btn .stat{ display:block; font-size:10.5px; color:var(--gold); margin-top:5px; }

  /* ---- 出題画面 ---- */
  .quiz-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; font-size:12px; color:var(--ink-soft);
  }
  .quiz-head .cat-label{ font-weight:700; color:var(--ink); font-size:13px; }
  .progress-track{ height:4px; background:var(--line); border-radius:2px; margin-bottom:22px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--gold); transition:width .25s; }
  .q-number{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border:1.5px solid var(--ink); border-radius:50%;
    font-size:13px; font-weight:700; margin-right:8px;
  }
  .q-text{ font-size:16px; line-height:1.8; margin:14px 0 22px; white-space:pre-wrap; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border:1px solid var(--line); border-radius:2px; background:#fff; cursor:pointer;
    font-size:14px; text-align:left; font-family:inherit; color:var(--ink); width:100%;
  }
  .choice:hover{ border-color:var(--gold); }
  .choice .bubble{
    flex:0 0 22px; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--ink);
  }
  .choice.selected{ border-color:var(--ink); background:#EFF1EC; }
  .choice.selected .bubble{ background:var(--ink); color:#fff; }

  .nav-row{ display:flex; justify-content:space-between; margin-top:24px; align-items:center; }
  .btn{ border:none; border-radius:2px; padding:11px 22px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:disabled{ background:#B9BEC6; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .select-warn{ font-size:11.5px; color:var(--red); margin-top:10px; min-height:14px; }

  /* ---- 結果画面 ---- */
  .result-wrap{ text-align:center; }
  .stamp{
    width:126px; height:126px; margin:6px auto 18px; border:3px solid var(--red); border-radius:50%;
    color:var(--red); display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-8deg); font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  }
  .stamp .score-num{ font-size:32px; font-weight:700; line-height:1; }
  .stamp .score-total{ font-size:12px; margin-top:2px; }
  .stamp .score-word{ font-size:12px; letter-spacing:0.2em; margin-top:4px; }
  .result-cat{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; }
  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:22px; }

  .review-list{ text-align:left; }
  .review-item{
    border:1px solid var(--line); border-radius:2px; background:#fff;
    padding:14px 16px; margin-bottom:10px;
  }
  .review-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .review-head .mark{
    flex:0 0 24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff;
  }
  .review-head .mark.ok{ background:var(--green); }
  .review-head .mark.ng{ background:var(--red); }
  .review-head .qlabel{ font-size:12px; color:var(--ink-soft); }
  .review-q{ font-size:13.5px; line-height:1.7; margin-bottom:8px; white-space:pre-wrap; }
  .review-ans{ font-size:12.5px; margin-bottom:6px; }
  .review-ans .you{ color:var(--ink-soft); }
  .review-exp{
    font-size:12.5px; line-height:1.7; color:var(--ink); background:var(--paper);
    border-radius:2px; padding:10px 12px; margin-top:6px;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="eyebrow">APTITUDE TEST PRACTICE</div>
    <h1>SPI対策問題集</h1>
    <p>ニックネームで記録しながら、弱点を見つけよう</p>
  </header>
  <div class="card" id="app"></div>
</div>

<script>
/* ========================= 問題データ ========================= */
const QUIZ_DATA = [
{ group:"言語", id:"nigo", name:"二語の関係", desc:"2語の関係性と同じ組み合わせを選ぶ", questions:[
  { q:"「医者:病院」と同じ関係の組み合わせはどれか。", choices:["教師:学校","患者:薬","看護師:注射","病気:治療"], answer:0, exp:"医者と病院は「職業と、その働く場所」の関係。同じ関係になるのは教師と学校。" },
  { q:"「牛乳:チーズ」と同じ関係の組み合わせはどれか。", choices:["日本酒:米","米:日本酒","蕎麦粉:蕎麦屋","牛肉:スーパー"], answer:1, exp:"牛乳とチーズは「原料と、それから作られる製品」の関係。米と日本酒が同じ関係。日本酒:米は順序が逆。" },
  { q:"「本:ページ」と同じ関係の組み合わせはどれか。", choices:["学校:先生","車:タイヤ","木:森","空:星"], answer:1, exp:"本とページは「全体と、それを構成する部分」の関係。車とタイヤが同じ関係。" },
  { q:"「馬:子馬」と同じ関係の組み合わせはどれか。", choices:["鳥:卵","魚:水槽","牛:子牛","羊:毛"], answer:2, exp:"馬と子馬は「動物と、その子」の関係。牛と子牛が同じ関係。" },
  { q:"「上昇:下降」と同じ関係の組み合わせはどれか。", choices:["増加:増大","開始:開催","拡大:縮小","成功:成長"], answer:2, exp:"上昇と下降は意味が対になる言葉の組み合わせ。拡大と縮小が同じ関係。" },
  { q:"「進歩:向上」と同じ関係の組み合わせはどれか。", choices:["拡大:縮小","温和:穏和","開始:終了","上昇:下降"], answer:1, exp:"進歩と向上は似た意味の言葉の組み合わせ。温和と穏和が同じ関係。" },
  { q:"「大工:のこぎり」と同じ関係の組み合わせはどれか。", choices:["医者:病院","教師:生徒","画家:絵筆","料理人:レストラン"], answer:2, exp:"大工とのこぎりは「職業と、それが使う道具」の関係。画家と絵筆が同じ関係。" },
  { q:"「大豆:味噌」と同じ関係の組み合わせはどれか。", choices:["日本酒:米","米:日本酒","蕎麦粉:蕎麦屋","牛肉:スーパー"], answer:1, exp:"大豆と味噌は「原料と、それから作られる製品」の関係。米と日本酒が同じ関係。" },
  { q:"「自動車:エンジン」と同じ関係の組み合わせはどれか。", choices:["家:柱","学校:先生","木:森","空:星"], answer:0, exp:"自動車とエンジンは「全体と、それを構成する重要な部分」の関係。家と柱が同じ関係。" },
  { q:"「傘:雨をしのぐ」と同じ関係の組み合わせはどれか。", choices:["ペン:文房具","眼鏡:視力を矯正する","車:ガソリン","本:図書館"], answer:1, exp:"傘は「雨をしのぐ」という用途を持つ道具。眼鏡と「視力を矯正する」が同じ関係。" }
]},
{ group:"言語", id:"gogi", name:"語句の意味", desc:"語彙力を問う問題", questions:[
  { q:"「杞憂」の意味として最も適切なものはどれか。", choices:["無用の心配をすること","深い後悔をすること","大きな喜び","素早い決断"], answer:0, exp:"「杞憂」は、起こる見込みのないことをあれこれ心配すること。" },
  { q:"「委細」の意味として最も適切なものはどれか。", choices:["誠実な態度","細かい事情","重要な役職","短い期間"], answer:1, exp:"「委細」は詳しい事情、細部にわたる事柄のこと。" },
  { q:"「拙速」の意味として最も適切なものはどれか。", choices:["丁寧で美しい仕上がり","慎重に時間をかけること","出来は悪いが仕上げが早いこと","突然の失敗"], answer:2, exp:"「拙速」は、できあがりは十分でなくても仕上げが早いこと。" },
  { q:"「憂慮」の意味として最も適切なものはどれか。", choices:["喜び楽しむこと","心配し思い悩むこと","怒りをあらわにすること","油断すること"], answer:1, exp:"「憂慮」は心配し思い悩むこと。" },
  { q:"「一朝一夕」の意味として最も適切なものはどれか。", choices:["長い年月","わずかな期間","突然の出来事","繰り返し行うこと"], answer:1, exp:"「一朝一夕」はわずかな期間のこと。「一朝一夕にはいかない」のように使う。" },
  { q:"「肝要」の意味として最も適切なものはどれか。", choices:["気楽なこと","複雑なこと","非常に大切なこと","珍しいこと"], answer:2, exp:"「肝要」は非常に大切なこと。" },
  { q:"「割愛」の意味として最も適切なものはどれか。", choices:["大切に保存すること","惜しみながら省略すること","強く要求すること","分割して支払うこと"], answer:1, exp:"「割愛」は惜しいと思いながら省略すること。" },
  { q:"「懸念」の意味として最も適切なものはどれか。", choices:["強く望むこと","深く感謝すること","気にかかって不安に思うこと","素早く決断すること"], answer:2, exp:"「懸念」は気にかかって不安に思うこと。" },
  { q:"「示唆」の意味として最も適切なものはどれか。", choices:["はっきりと命令すること","それとなく示し教えること","強く反対すること","詳しく説明し尽くすこと"], answer:1, exp:"「示唆」はそれとなく示し教えること。" },
  { q:"「暫定」の意味として最も適切なものはどれか。", choices:["永久に続くこと","過去の出来事","予想外の結果","正式に決まるまでの一時的な措置"], answer:3, exp:"「暫定」は正式に決まるまでの間の、一時的な措置のこと。" }
]},
{ group:"言語", id:"yoho", name:"語句の用法", desc:"多義語の用法や文法的用法の違いを判別", questions:[
  { q:"下線部の「きく」と同じ意味・用法で使われているものはどれか。\n「薬がきく」", choices:["話をきく","目がきく","気がきく","この機械はよくきく"], answer:3, exp:"「薬がきく」は「効果がある」の意味。同じ意味なのは「この機械はよくきく(効く)」。" },
  { q:"下線部の「あがる」と同じ意味・用法で使われているものはどれか。\n「入学式で名前を呼ばれ、あがってしまった」", choices:["面接で緊張してあがってしまった","二階にあがる","雨があがる","利益があがる"], answer:0, exp:"ここでの「あがる」は「緊張する」の意味。同じ意味なのは「面接で緊張してあがってしまった」。" },
  { q:"下線部の「とる」と同じ意味・用法で使われているものはどれか。\n「栄養をとる」", choices:["休憩をとる","写真をとる","責任をとる","年をとる"], answer:0, exp:"「栄養をとる」は「摂取する・確保する」の意味。同じ意味なのは「休憩をとる」。" },
  { q:"下線部の「みる」と同じ意味・用法で使われているものはどれか。\n「味をみる」", choices:["具合をみる","映画をみる","医者にみてもらう","夢をみる"], answer:0, exp:"「味をみる」は「確認・試す」の意味。同じ意味なのは「具合をみる」。" },
  { q:"下線部の「きる」と同じ意味・用法で使われているものはどれか。\n「トップを走りきる」", choices:["マラソンを完走しきる","紙をはさみできる","電話をきる","縁をきる"], answer:0, exp:"「走りきる」は「最後までやり遂げる」の意味。同じ意味なのは「完走しきる」。" },
  { q:"下線部の「たつ」と同じ意味・用法で使われているものはどれか。\n「時間がたつ」", choices:["月日がたつ","教壇にたつ","家がたつ","決意がたつ"], answer:0, exp:"「時間がたつ」は「経過する」の意味。同じ意味なのは「月日がたつ」。" },
  { q:"下線部の「あげる」と同じ意味・用法で使われているものはどれか。\n「効果をあげる」", choices:["実績をあげる","手をあげる","プレゼントをあげる","声をあげる"], answer:0, exp:"「効果をあげる」は「成果を出す」の意味。同じ意味なのは「実績をあげる」。" },
  { q:"下線部の「うつ」と同じ意味・用法で使われているものはどれか。\n「観客の心をうつ」", choices:["この映画は観る人の胸をうつ","太鼓をうつ","メールをうつ","碁をうつ"], answer:0, exp:"「心をうつ」は「感動させる」の意味。同じ意味なのは「胸をうつ」。" },
  { q:"下線部の「かたい」と同じ意味・用法で使われているものはどれか。\n「合格はかたい話だ」", choices:["この契約はかたい約束だ","この石はかたい","彼の性格はかたい","表情がかたい"], answer:0, exp:"「かたい話」は「確実だ」の意味。同じ意味なのは「かたい約束」。" },
  { q:"下線部の「はかる」と同じ意味・用法で使われているものはどれか。\n「時間をはかる」", choices:["体重をはかる","解決をはかる","会議にはかる","暗殺をはかる"], answer:0, exp:"「時間をはかる」は「測定する」の意味。同じ意味なのは「体重をはかる」。" }
]},
{ group:"言語", id:"narabekae", name:"文の並べ替え", desc:"バラバラの文章を意味が通るように並べ替える", questions:[
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. しかし、実際に試してみると効果は限定的だった\nイ. 新しいダイエット方法が話題になった\nウ. そこで、専門家に相談することにした\nエ. テレビ番組で紹介されたことがきっかけだった", choices:["イ→ア→エ→ウ","エ→イ→ア→ウ","イ→エ→ウ→ア","ア→イ→エ→ウ"], answer:1, exp:"「番組で紹介(エ)」→「話題になった(イ)」→「試したが効果限定的(ア)」→「専門家に相談(ウ)」の順が自然。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. だが、単なる知識の詰め込みでは意味がない\nイ. 学習において重要なのは知識の量ではなく、その活用方法である\nウ. 実践を通じて初めて知識は生きた力となる\nエ. もちろん基礎知識は不可欠だ", choices:["エ→イ→ア→ウ","イ→ア→エ→ウ","イ→エ→ア→ウ","ア→イ→エ→ウ"], answer:2, exp:"「重要なのは活用方法(イ)」→「もちろん基礎知識は不可欠(エ)」→「だが詰め込みは意味ない(ア)」→「実践で生きた力となる(ウ)」の順。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. その結果、生産性が大幅に向上した\nイ. 工場では新しい機械が導入された\nウ. 当初は使い方に戸惑う従業員も多かった\nエ. しかし研修を重ねることで徐々に慣れていった", choices:["ウ→イ→エ→ア","イ→エ→ウ→ア","イ→ア→ウ→エ","イ→ウ→エ→ア"], answer:3, exp:"「機械導入(イ)」→「戸惑う従業員(ウ)」→「研修で慣れる(エ)」→「生産性向上(ア)」の順が自然な流れ。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. けれども、努力を続けるうちに少しずつ上達していった\nイ. 彼は最初、全く泳ぐことができなかった\nウ. 今では大会に出場するまでになった\nエ. コーチの指導のもと、毎日欠かさず練習した", choices:["イ→ア→エ→ウ","エ→イ→ア→ウ","イ→エ→ア→ウ","ア→エ→イ→ウ"], answer:2, exp:"「最初できなかった(イ)」→「コーチの指導で練習(エ)」→「けれども努力で上達(ア)」→「大会に出場(ウ)」の順。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. しかし、コストの高さがネックとなっている\nイ. 再生可能エネルギーの導入が世界的に進んでいる\nウ. 各国は補助金制度などで普及を後押ししている\nエ. 太陽光や風力といった技術が代表的だ", choices:["エ→イ→ア→ウ","イ→エ→ア→ウ","イ→ア→エ→ウ","ウ→イ→エ→ア"], answer:1, exp:"「導入が進んでいる(イ)」→「代表例は太陽光・風力(エ)」→「コストがネック(ア)」→「補助金で後押し(ウ)」の順。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. その原因の一つに、睡眠不足が挙げられる\nイ. 現代人の多くが慢性的な疲労を感じている\nウ. 十分な休息を取ることが何より重要だ\nエ. 忙しい日常の中で睡眠時間を削る人は少なくない", choices:["イ→エ→ア→ウ","ア→イ→エ→ウ","イ→ア→エ→ウ","エ→ア→イ→ウ"], answer:2, exp:"「現代人は疲労を感じている(イ)」→「原因は睡眠不足(ア)」→「忙しくて睡眠を削る(エ)」→「休息が重要(ウ)」の順。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. だからこそ、定期的な情報収集が欠かせない\nイ. ビジネス環境は目まぐるしく変化している\nウ. 変化に対応できない企業は淘汰されてしまう\nエ. 数年前の常識が今では通用しないことも多い", choices:["イ→エ→ウ→ア","エ→イ→ウ→ア","イ→ウ→エ→ア","ア→イ→エ→ウ"], answer:0, exp:"「環境が変化している(イ)」→「常識が通用しない(エ)」→「対応できない企業は淘汰(ウ)」→「情報収集が欠かせない(ア)」の順。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. まず野菜を細かく切る\nイ. 次に鍋に油をひいて炒める\nウ. 最後に調味料で味を整える\nエ. 火が通ったら水を加えて煮込む", choices:["ア→イ→エ→ウ","イ→ア→エ→ウ","ア→エ→イ→ウ","エ→ア→イ→ウ"], answer:0, exp:"「まず切る(ア)」→「次に炒める(イ)」→「火が通ったら煮込む(エ)」→「最後に味を整える(ウ)」の順。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. 一方で、若手社員からは不満の声も上がっている\nイ. 新しい評価制度が来月から導入される\nウ. 会社側は成果を正当に評価できると説明している\nエ. 制度の詳細は先週の説明会で共有された", choices:["エ→イ→ウ→ア","イ→ウ→エ→ア","ア→イ→エ→ウ","イ→エ→ウ→ア"], answer:3, exp:"「制度が導入される(イ)」→「詳細は説明会で共有(エ)」→「会社は正当評価できると説明(ウ)」→「一方不満の声も(ア)」の順。" },
  { q:"次のア〜エを意味が通るように並べ替えたとき、正しい順序はどれか。\nア. しかし近年は在宅勤務を選ぶ人も増えている\nイ. かつて出勤して働くことが当たり前とされていた\nウ. 通勤時間の削減や柔軟な働き方が理由として挙げられる\nエ. 企業側も設備投資を進めている", choices:["ア→イ→ウ→エ","イ→ウ→ア→エ","エ→イ→ア→ウ","イ→ア→ウ→エ"], answer:3, exp:"「かつて出勤が当たり前(イ)」→「近年は在宅勤務が増えている(ア)」→「通勤削減など理由(ウ)」→「企業も設備投資(エ)」の順。" }
]},
{ group:"言語", id:"kuuran", name:"空欄補充", desc:"文中の空欄に適切な語句を入れる", questions:[
  { q:"彼の意見は理論的で（　）がある。", choices:["説得力","説得料","説得性","説得感"], answer:0, exp:"「説得力がある」が自然な言い回し。" },
  { q:"長年の努力が（　）を結んだ。", choices:["根","芽","花","実"], answer:3, exp:"「実を結ぶ」で、努力の成果が実際の結果として現れるという慣用表現。" },
  { q:"このプロジェクトの成功は、彼の（　）な判断によるところが大きい。", choices:["的確","的中","適格","適正"], answer:0, exp:"「的確な判断」が自然。「適格」は資格を満たすこと、「適正」は程度が適切であることを表し、文意に合わない。" },
  { q:"彼のアイデアは（　）を射ており、多くの社員が納得した。", choices:["的","当","芯","核"], answer:0, exp:"「的を射る」は要点を正確にとらえているという意味の慣用句。" },
  { q:"突然の質問に、彼は（　）を突かれたような顔をした。", choices:["意表","意図","意志","意向"], answer:0, exp:"「意表を突く」は相手の予想していないことをするという意味の慣用句。" },
  { q:"彼女は仕事に対して非常に（　）な姿勢で取り組んでいる。", choices:["真摯","真実","真剣味","真心"], answer:0, exp:"「真摯な姿勢」が自然な言い回し。" },
  { q:"この計画には多くの（　）が伴うため、慎重な検討が必要だ。", choices:["リスク","チャンス","コスト","メリット"], answer:0, exp:"「慎重な検討が必要」という文脈から、危険性を表す「リスク」が適切。" },
  { q:"彼の説明は（　）を得ており、誰もが理解しやすかった。", choices:["要領","要点","要素","要因"], answer:0, exp:"「要領を得る」は物事の要点をとらえているという意味の慣用句。" },
  { q:"長引く不況で、多くの企業が（　）を余儀なくされた。", choices:["縮小","拡大","発展","成長"], answer:0, exp:"「長引く不況」という文脈から、企業活動の「縮小」が適切。" },
  { q:"彼は周囲の反対を（　）に、自分の信念を貫いた。", choices:["よそ","もと","元","中心"], answer:0, exp:"「反対をよそに」は、周囲の反対を気にせずに、という意味の慣用表現。" }
]},
{ group:"言語", id:"jukugo", name:"熟語の成り立ち", desc:"対義語の組み合わせ・修飾関係などの構成を判別", questions:[
  { q:"「進退」の成り立ちとして正しいものはどれか。", choices:["対になる意味の漢字の組み合わせ","似た意味の漢字の組み合わせ","上の字が下の字を修飾する","下から上に読むと意味がわかる"], answer:0, exp:"「進む」⇔「退く」で意味が対になる漢字の組み合わせ。" },
  { q:"「豊富」の成り立ちとして正しいものはどれか。", choices:["対になる意味の組み合わせ","似た意味の漢字の組み合わせ","主語と述語の関係","上が下を打ち消す"], answer:1, exp:"「豊か」と「富む」はどちらも「多い・満ちている」という似た意味を持つ組み合わせ。" },
  { q:"「日没」の成り立ちとして正しいものはどれか。", choices:["上の字が主語、下の字が動作(述語)","対になる意味の組み合わせ","似た意味の漢字の組み合わせ","下の字が上の字を打ち消す"], answer:0, exp:"「日が没する」のように、上の字(日)が主語、下の字(没)が動作を表す関係。" },
  { q:"「多少」の成り立ちとして正しいものはどれか。", choices:["対になる意味の組み合わせ","似た意味の組み合わせ","主語述語の関係","上が下を修飾する"], answer:0, exp:"「多い」⇔「少ない」で意味が対になる漢字の組み合わせ。" },
  { q:"「温暖」の成り立ちとして正しいものはどれか。", choices:["対になる意味の組み合わせ","似た意味の組み合わせ","主語述語の関係","上が下を打ち消す"], answer:1, exp:"「温かい」と「暖かい」はどちらも似た意味を持つ漢字の組み合わせ。" },
  { q:"「登山」の成り立ちとして正しいものはどれか。", choices:["下の字が上の字の目的語になる","対になる意味の組み合わせ","似た意味の組み合わせ","主語述語の関係"], answer:0, exp:"「山に登る」のように、下の字(山)が上の字(登)の目的語になる関係。" },
  { q:"「非常」の成り立ちとして正しいものはどれか。", choices:["上の字が下の字を打ち消す","対になる意味の組み合わせ","似た意味の組み合わせ","主語述語の関係"], answer:0, exp:"「非」が「常ではない」と下の字を打ち消す関係。" },
  { q:"「頭痛」の成り立ちとして正しいものはどれか。", choices:["上が主語、下が述語の関係","対になる意味の組み合わせ","似た意味の組み合わせ","上が下を打ち消す"], answer:0, exp:"「頭が痛い」のように、上の字が主語、下の字が述語(状態)を表す関係。" },
  { q:"「強弱」の成り立ちとして正しいものはどれか。", choices:["対になる意味の組み合わせ","似た意味の組み合わせ","主語述語の関係","上が下を修飾する"], answer:0, exp:"「強い」⇔「弱い」で意味が対になる漢字の組み合わせ。" },
  { q:"「未定」の成り立ちとして正しいものはどれか。", choices:["上の字が下の字を打ち消す","対になる意味の組み合わせ","似た意味の組み合わせ","主語述語の関係"], answer:0, exp:"「未」が「まだ定まっていない」と下の字を打ち消す関係。" }
]},
{ group:"言語", id:"dokkai", name:"文章読解", desc:"文章を読んで内容についての設問に答える", questions:[
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「情報技術の発展により、私たちの働き方は大きく変化した。従来はオフィスに出社することが当然とされていたが、近年は場所を問わず働けるリモートワークが普及している。一方で、対面でのコミュニケーションが減ることによる弊害も指摘されており、企業は両者のバランスを模索している。」", choices:["企業は出社とリモートワークのバランスを模索している","リモートワークには弊害がないとされている","オフィス出社は完全に廃止された","対面コミュニケーションは重要ではないと結論づけている"], answer:0, exp:"最後の一文に「企業は両者のバランスを模索している」とある。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「近年、食品ロスの削減が社会的な課題となっている。家庭から出る食品ロスだけでなく、飲食店や小売店で発生するロスも多く、その対策として賞味期限の見直しや余った食品の寄付活動が進められている。しかし、こうした取り組みはまだ一部にとどまっており、社会全体への浸透が今後の課題である。」", choices:["食品ロス削減の取り組みは社会全体に十分浸透している","食品ロスは家庭からのみ発生する","食品ロス削減のための取り組みは一部にとどまっている","賞味期限の見直しはすでに完了している"], answer:2, exp:"最後の一文に「こうした取り組みはまだ一部にとどまっている」とある。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「健康寿命を延ばすためには、適度な運動と栄養バランスの取れた食事が欠かせない。特に高齢者にとっては、筋力の低下を防ぐことが自立した生活を続けるうえで重要である。近年は自治体が運動教室を開催するなど、地域ぐるみでの取り組みも増えている。」", choices:["高齢者の自立した生活には筋力低下の予防が重要である","健康寿命は食事だけで決まる","自治体は運動教室の開催をやめている","高齢者には運動は不要である"], answer:0, exp:"「筋力の低下を防ぐことが自立した生活を続けるうえで重要」と述べられている。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「ある企業では、社員のアイデアを積極的に取り入れる制度を導入している。誰でも自由に提案できる仕組みを整えたことで、現場から多くの改善案が寄せられるようになった。ただし、提案の数が増える一方で、それを実行に移すための人員や予算が不足しており、優先順位をどうつけるかが新たな課題となっている。」", choices:["提案を実行するための人員や予算の不足が課題となっている","社員からの提案は禁止されている","制度導入により課題はすべて解決した","予算は十分に確保されている"], answer:0, exp:"「実行に移すための人員や予算が不足しており」と述べられている。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「読書には、知識を得るだけでなく、想像力を養う効果があるといわれている。特に子どものころに多くの本に触れることは、語彙力や表現力の基礎を作るうえで大きな役割を果たす。しかし近年はスマートフォンの普及により、子どもの読書量が減少しているとの調査結果もある。」", choices:["子どもの読書量は増加している","スマートフォンの普及が子どもの読書量減少の一因とされている","読書は語彙力にのみ影響する","読書は大人にとって不要である"], answer:1, exp:"最後の一文に「スマートフォンの普及により、子どもの読書量が減少している」とある。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「近年、企業の間でSDGs(持続可能な開発目標)への取り組みが広がっている。環境負荷の低減だけでなく、従業員の働きやすさの向上や地域社会への貢献など、その内容は多岐にわたる。ただし、取り組みが形だけのものにとどまり、実質的な成果につながっていないという批判も一部で見られる。」", choices:["SDGsへの取り組みは環境負荷の低減のみを指す","すべての企業の取り組みが批判されている","取り組みが形だけにとどまっているという批判もある","SDGsは日本独自の目標である"], answer:2, exp:"最後の一文に「取り組みが形だけのものにとどまり…という批判も一部で見られる」とある。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「ある調査によると、転職を経験した人の多くが『もっと早く行動すればよかった』と感じているという。一方で、転職には情報収集や準備に時間がかかるため、慎重に進めることも重要だとされる。行動のタイミングと十分な準備、その両立が転職成功の鍵といえる。」", choices:["転職は準備なしに行うべきだ","行動のタイミングと準備の両立が転職成功の鍵とされている","転職を経験した人は全員後悔している","転職には時間をかけるべきではない"], answer:1, exp:"最後の一文に「行動のタイミングと十分な準備、その両立が転職成功の鍵」とある。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「都市部への人口集中が進む一方で、地方では過疎化が深刻な問題となっている。地方自治体は移住者を呼び込むための支援策を打ち出しているが、雇用の確保や生活インフラの整備といった課題も多く、効果は地域によってばらつきがある。」", choices:["地方移住支援策の効果には地域差がある","過疎化は都市部の問題である","すべての地方で移住者が急増している","雇用確保の課題はすでに解決している"], answer:0, exp:"最後の一文に「効果は地域によってばらつきがある」とある。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「睡眠不足は集中力の低下だけでなく、長期的には健康リスクを高めることが知られている。専門家は、就寝前のスマートフォンの使用を控えることや、規則正しい生活リズムを保つことが質の良い睡眠につながると指摘している。」", choices:["睡眠不足は集中力低下や健康リスクの増加につながる","スマートフォンの使用は睡眠の質を高める","睡眠不足に健康への影響はない","生活リズムは睡眠の質に関係しない"], answer:0, exp:"「集中力の低下だけでなく、長期的には健康リスクを高める」とある。" },
  { q:"次の文章を読み、内容として最も適切なものを選べ。\n「ある製造業の企業では、若手社員の早期離職が課題となっていた。原因を調査したところ、業務内容そのものよりも、上司とのコミュニケーション不足が主な要因であることがわかった。そこで、定期的な面談の機会を設けたところ、離職率は大きく改善した。」", choices:["定期的な面談の導入により離職率が改善した","離職の主な原因は業務内容の難しさだった","この企業では離職率の改善は見られなかった","上司とのコミュニケーションは離職と無関係だった"], answer:0, exp:"最後の一文に「定期的な面談の機会を設けたところ、離職率は大きく改善した」とある。" }
]},
{ group:"非言語", id:"suiron", name:"推論", desc:"順位・位置関係・対戦成績・嘘つき問題などの論理的推論", questions:[
  { q:"A,B,C,Dの4人が徒競走をした。次のことがわかっているとき、速い順に並べたものはどれか。\n・AはBより速かった\n・CはDより速かった\n・BはCより速かった", choices:["A→B→C→D","D→C→B→A","B→A→C→D","順位は確定できない"], answer:0, exp:"A>B、B>C、C>Dより、A>B>C>D。速い順はA→B→C→D。" },
  { q:"A,B,Cの3人のうち1人だけが嘘をついている。次の発言から、嘘をついているのは誰か。\nA「私は嘘をついていない」\nB「Aが嘘をついている」\nC「Bは正直者だ」", choices:["A","B","C","特定できない"], answer:0, exp:"Aが嘘つきと仮定すると、B・Cの発言はすべて矛盾なく成立する。B、Cが嘘つきの場合はそれぞれ矛盾が生じるため、嘘をついているのはA。" },
  { q:"X,Y,Zの3人のタイムについて次のことがわかっている。速い順に並べたものはどれか。\n・XはYより速い\n・ZはXより遅い\n・YはZより速い", choices:["X→Y→Z","Y→X→Z","Z→Y→X","決定できない"], answer:0, exp:"X>Y、X>Z、Y>Zより、X>Y>Z。速い順はX→Y→Z。" },
  { q:"A,B,C,D,Eの5人がテストの得点を比較した。次のことがわかっているとき、得点が3番目に高いのは誰か。\n・AはBより高い\n・BはCより高い\n・DはAより高い\n・EはCより低い", choices:["A","B","C","D"], answer:1, exp:"D>A>B>C>Eの順になる。3番目に高いのはB。" },
  { q:"P,Q,Rの3人のうち、1人だけが正直者で、残り2人は嘘つきである。次の発言から、正直者は誰か。\nP「Qは嘘つきだ」\nQ「Rは嘘つきだ」\nR「私は正直者だ」", choices:["P","Q","R","特定できない"], answer:1, exp:"Qを正直者と仮定すると、Rは嘘つき(Qの発言通り)、Rの発言は嘘なのでRは実際には正直者ではなく一致。Pは嘘つきなので発言は嘘、実際はQが正直者で一致。矛盾なく成立するのはQのみ。" },
  { q:"6人の生徒が横一列に並んでいる。次の条件から、左から5番目にいるのは誰か。\n・Aは左から2番目\n・Bは右端(6番目)\n・CはAのすぐ右(3番目)\n・DはCの隣でBではない(4番目)\n・EはDより左(1番目)", choices:["C","D","E","F"], answer:3, exp:"A=2,B=6,C=3,D=4,E=1と決まり、残る5番目はF。" },
  { q:"A,B,Cの3チームが総当たり戦を行った。結果は次の通り。この情報から確実に言えることはどれか。\n・AはBに勝った\n・BはCに勝った\n・AとCの対戦結果は引き分けだった", choices:["3チームの中でAが最も勝ち点が高い","Cが最も勝ち点が高い","Bは1勝もしていない","3チームの勝ち点はすべて同じ"], answer:0, exp:"勝ち3点・引分1点・負け0点とすると、A=勝ち+引分=4点、B=負け+勝ち=2点、C=引分+負け=1点で、Aが最多となる。" },
  { q:"4人の身長を比べた。次のことがわかっているとき、確実に言えることはどれか。\n・AはBより高い\n・CはAより低い\n・DはBより高い", choices:["Dが最も高いとは限らない","Bが最も高い","Cが最も高い","身長の順序は完全に確定する"], answer:0, exp:"A>B、A>C、D>Bまでは分かるが、AとDの大小関係は不明なため、Dが最も高いとは断定できない。" },
  { q:"A,B,C,Dの4チームが総当たり戦(勝ち2点・引分1点・負け0点)を行い、Aだけが全勝、Dだけが全敗だった。BとCの対戦は引き分けだった。このときB、Cの勝ち点として正しい組み合わせはどれか。", choices:["B:3点 C:3点","B:4点 C:2点","B:2点 C:4点","B:5点 C:1点"], answer:0, exp:"BもCもAに負け(0点)、Dに勝ち(2点)、互いに引き分け(1点)となるため、どちらも合計3点。" },
  { q:"A〜Eの5人がじゃんけん大会のトーナメントに参加した。次の情報からわかることとして正しいものはどれか。\n・AはBに勝ち、決勝でCに負けた\n・DはEに勝ったが、準決勝でAに負けた", choices:["優勝したのはCである","優勝したのはAである","Dは決勝に進出した","Eは準決勝に進出した"], answer:0, exp:"Aは決勝でCに負けたため、優勝したのはC。" }
]},
{ group:"非言語", id:"baai", name:"場合の数", desc:"順列・組み合わせの計算", questions:[
  { q:"5人の中から3人を選んで委員会を作る場合、選び方は何通りあるか。", choices:["10通り","15通り","20通り","60通り"], answer:0, exp:"組み合わせなので 5C3 = (5×4×3)/(3×2×1) = 10通り。" },
  { q:"0,1,2,3,4の5つの数字から異なる3つを選んで3桁の整数を作るとき、何通りできるか。ただし先頭の数字は0にできない。", choices:["48通り","60通り","36通り","24通り"], answer:0, exp:"全体は5P3=60通り。先頭が0になる場合(4P2=12通り)を引いて 60-12=48通り。" },
  { q:"男性3人、女性2人が1列に並ぶとき、女性2人が隣り合う並び方は何通りあるか。", choices:["24通り","48通り","60通り","120通り"], answer:1, exp:"女性2人を1ブロックとみなすと4つを並べる方法は4!=24通り。ブロック内の並び方2!をかけて 24×2=48通り。" },
  { q:"男子4人、女子3人の中から、男子2人・女子2人を選ぶ選び方は何通りあるか。", choices:["12通り","18通り","24通り","36通り"], answer:1, exp:"4C2×3C2=6×3=18通り。" },
  { q:"1から7までの数字が書かれた7枚のカードから3枚を選んで並べ、3桁の数を作るとき、何通りできるか。", choices:["35通り","120通り","210通り","343通り"], answer:2, exp:"7P3=7×6×5=210通り。" },
  { q:"大人3人、子供2人が円形のテーブルに座るとき、並び方は何通りあるか(円順列)。", choices:["12通り","24通り","60通り","120通り"], answer:1, exp:"円順列は(人数-1)!で求められる。(5-1)!=4!=24通り。" },
  { q:"A,B,C,D,E,Fの6文字を全部使って作れる文字列は何通りあるか。ただし同じ文字はない。", choices:["120通り","360通り","720通り","46656通り"], answer:2, exp:"異なる6つを並べる方法は6!=720通り。" },
  { q:"赤玉4個、白玉3個の合計7個を1列に並べるとき、並べ方は何通りあるか(同じ色の玉は区別しない)。", choices:["21通り","35通り","70通り","105通り"], answer:1, exp:"7!/(4!×3!)=35通り。" },
  { q:"8人の中からリーダー1人、サブリーダー1人を選ぶとき、選び方は何通りあるか(役職の区別あり)。", choices:["16通り","28通り","56通り","64通り"], answer:2, exp:"役職の区別があるので順列8P2=8×7=56通り。" },
  { q:"3種類のスープと4種類のメイン料理から、それぞれ1つずつ選んでセットを作るとき、何通りの組み合わせがあるか。", choices:["7通り","12通り","24通り","34通り"], answer:1, exp:"3×4=12通り。" }
]},
{ group:"非言語", id:"kakuritsu", name:"確率", desc:"確率の計算", questions:[
  { q:"サイコロを1回振って、偶数の目が出る確率はいくらか。", choices:["1/2","1/3","2/3","1/6"], answer:0, exp:"偶数の目は2,4,6の3通り。全体は6通りなので 3/6=1/2。" },
  { q:"赤玉3個、白玉2個が入った袋から玉を1個取り出すとき、白玉が出る確率はいくらか。", choices:["2/5","3/5","1/2","1/5"], answer:0, exp:"全体5個のうち白玉は2個なので 2/5。" },
  { q:"コインを2回投げるとき、少なくとも1回は表が出る確率はいくらか。", choices:["1/2","3/4","1/4","1"], answer:1, exp:"余事象「2回とも裏」の確率は1/4。1-1/4=3/4。" },
  { q:"赤玉3個、白玉4個、合計7個から2個を同時に取り出すとき、2個とも赤玉である確率はいくらか。", choices:["1/7","3/7","2/7","1/3"], answer:0, exp:"7C2=21通り、赤2個は3C2=3通り。確率=3/21=1/7。" },
  { q:"サイコロを2回振るとき、出た目の和が7になる確率はいくらか。", choices:["1/12","1/9","1/6","1/8"], answer:2, exp:"和が7になる組は6通り(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)。全体36通りより6/36=1/6。" },
  { q:"当たりくじ2本、はずれくじ8本、合計10本のくじから1本引くとき、はずれる確率はいくらか。", choices:["1/5","2/5","3/5","4/5"], answer:3, exp:"はずれは8本なので8/10=4/5。" },
  { q:"男子3人、女子2人の中からくじ引きで2人の代表を選ぶとき、2人とも女子になる確率はいくらか。", choices:["1/10","1/5","3/10","2/5"], answer:0, exp:"5C2=10通り、女子2人は2C2=1通り。確率=1/10。" },
  { q:"1つのサイコロを1回振るとき、3の倍数の目が出る確率はいくらか。", choices:["1/6","1/3","1/2","2/3"], answer:1, exp:"3の倍数の目は3,6の2通り。確率=2/6=1/3。" },
  { q:"コインを3回投げるとき、3回とも同じ面が出る確率はいくらか。", choices:["1/8","1/4","3/8","1/2"], answer:1, exp:"表表表・裏裏裏の2通り、全体8通り。確率=2/8=1/4。" },
  { q:"袋の中に赤玉2個、白玉3個が入っている。玉を1個取り出し、戻さずにもう1個取り出すとき、2個とも白玉である確率はいくらか。", choices:["1/5","3/10","2/5","3/5"], answer:1, exp:"1個目白の確率3/5、2個目白の確率2/4=1/2。3/5×1/2=3/10。" }
]},
{ group:"非言語", id:"sonneki", name:"損益算", desc:"原価・定価・利益に関する計算", questions:[
  { q:"原価800円の商品に25%の利益を見込んで定価をつけた。定価はいくらか。", choices:["1000円","900円","1050円","1200円"], answer:0, exp:"800×1.25=1000円。" },
  { q:"定価2000円の商品を3割引で販売した。販売価格はいくらか。", choices:["1400円","1600円","1200円","1500円"], answer:0, exp:"2000×(1-0.3)=1400円。" },
  { q:"ある商品を原価の20%増しの定価で売り、さらに定価から10%引きで販売した。売価は原価の何倍か。", choices:["1.08倍","1.1倍","1.02倍","0.98倍"], answer:0, exp:"1.2×0.9=1.08倍。" },
  { q:"原価1200円の商品に3割の利益を見込んで定価をつけたが、売れなかったため定価の1割引きで販売した。売価はいくらか。", choices:["1560円","1404円","1200円","1350円"], answer:1, exp:"定価=1200×1.3=1560円。売価=1560×0.9=1404円。" },
  { q:"ある商品を定価の20%引きで売ったところ、利益は原価の4%になった。定価は原価の何倍か。", choices:["1.2倍","1.25倍","1.3倍","1.35倍"], answer:2, exp:"定価×0.8=原価×1.04より、定価=原価×1.3。" },
  { q:"原価2000円の商品を3割の利益を見込んで定価をつけたところ、売れなかったので定価から400円値引きして販売した。このときの利益はいくらか。", choices:["600円","400円","100円","200円"], answer:3, exp:"定価=2000×1.3=2600円。売価=2600-400=2200円。利益=2200-2000=200円。" },
  { q:"仕入れ値の25%の利益を見込んで定価3750円をつけた。仕入れ値はいくらか。", choices:["2800円","3000円","3125円","3200円"], answer:1, exp:"仕入れ値×1.25=3750より、仕入れ値=3000円。" },
  { q:"ある商品を定価の10%引きで売ると、利益は原価の8%になる。定価は原価の何倍か。", choices:["1.1倍","1.18倍","1.2倍","1.25倍"], answer:2, exp:"定価×0.9=原価×1.08より、定価=原価×1.2。" },
  { q:"原価1500円の品物を定価2000円で売ったが、売れ残ったため定価の15%引きで販売した。このときの利益または損失はいくらか。", choices:["200円の損失","100円の損失","300円の利益","200円の利益"], answer:3, exp:"売価=2000×0.85=1700円。利益=1700-1500=200円の利益。" },
  { q:"ある店で原価800円の商品を1000個仕入れ、定価1200円で売り始めたが、600個売れたところで残りを定価の半額で販売しすべて売り切った。総利益はいくらか。", choices:["80,000円","120,000円","200,000円","160,000円"], answer:3, exp:"600個×(1200-800)=240,000円。残り400個×(600-800)=-80,000円。合計240,000-80,000=160,000円。" }
]},
{ group:"非言語", id:"waribiki", name:"料金割引", desc:"割引後の料金計算", questions:[
  { q:"通常料金1500円の映画チケットが学生割引で20%引きになる。学生料金はいくらか。", choices:["1200円","1300円","1000円","1350円"], answer:0, exp:"1500×0.8=1200円。" },
  { q:"定価の15%引きで売られている商品を1700円で購入した。定価はいくらか。", choices:["2000円","1955円","1900円","2100円"], answer:0, exp:"定価×0.85=1700円より、定価=1700÷0.85=2000円。" },
  { q:"2割引で購入した商品の支払い額が3200円だった。定価はいくらか。", choices:["4000円","3840円","4200円","3600円"], answer:0, exp:"定価×0.8=3200円より、定価=3200÷0.8=4000円。" },
  { q:"定価5000円の商品が「2割引きの上、さらに500円引き」で販売されている。支払い額はいくらか。", choices:["4000円","3000円","4500円","3500円"], answer:3, exp:"5000×0.8=4000円。4000-500=3500円。" },
  { q:"あるジムの月会費は通常8000円だが、年間契約をすると全体で15%割引になる。年間契約の総額はいくらか。", choices:["80000円","84000円","86000円","81600円"], answer:3, exp:"年間通常額=8000×12=96000円。96000×0.85=81600円。" },
  { q:"原価1000円の商品を定価1500円から売価1200円に値引きして売った。定価に対する割引率は何%か。", choices:["15%","20%","25%","30%"], answer:1, exp:"(1500-1200)/1500=0.2=20%。" },
  { q:"3割引セールで購入した靴の支払い額が4200円だった。このセールがなければ何円で購入することになっていたか。", choices:["5500円","5800円","6000円","6200円"], answer:2, exp:"定価×0.7=4200円より、定価=6000円。" },
  { q:"ある美容室では、2回目以降の来店で会計から10%引きになる。3回目の来店で通常料金6000円のカットを受けた場合、支払い額はいくらか。", choices:["5000円","5400円","5600円","5800円"], answer:1, exp:"6000×0.9=5400円。" },
  { q:"定価の25%引きで販売されている商品を2個購入したところ、合計で4500円だった。この商品の定価はいくらか。", choices:["2800円","3000円","3200円","3500円"], answer:1, exp:"1個の売価は2250円。定価×0.75=2250円より、定価=3000円。" },
  { q:"会員価格は非会員価格の85%に設定されている。非会員価格が4000円のとき、会員価格はいくらか。", choices:["3200円","3400円","3600円","3800円"], answer:1, exp:"4000×0.85=3400円。" }
]},
{ group:"非言語", id:"sokudo", name:"速度算", desc:"速さ・時間・距離。旅人算なども含む", questions:[
  { q:"時速60kmで3時間走ったときの走行距離は何kmか。", choices:["150km","180km","200km","240km"], answer:1, exp:"60km/時×3時間=180km。" },
  { q:"家から駅まで2.4kmの道のりを分速80mで歩くと何分かかるか。", choices:["20分","24分","30分","40分"], answer:2, exp:"2.4km=2400m。2400m÷80m/分=30分。" },
  { q:"A地点からB地点まで240kmの距離を、行きは時速60km、帰りは時速40kmで往復した。往復の平均速度は時速何kmか。", choices:["45km","48km","50km","52km"], answer:1, exp:"行き4時間、帰り6時間、合計480km÷10時間=時速48km。" },
  { q:"A地点からB地点までの距離は18kmである。時速4.5kmで歩くと何時間かかるか。", choices:["3時間","4時間","4.5時間","5時間"], answer:1, exp:"18÷4.5=4時間。" },
  { q:"兄は分速150mで、弟は分速100mで同じ地点から同時に反対方向に歩き始めた。10分後の2人の間の距離は何mか。", choices:["1500m","2000m","2500m","3000m"], answer:2, exp:"(150+100)×10=2500m。" },
  { q:"電車が160kmの距離を2時間で走った。この電車の速さは時速何kmか。", choices:["70km","75km","80km","90km"], answer:2, exp:"160÷2=時速80km。" },
  { q:"A君は分速80mで歩き、B君はA君の10分後に同じ地点から分速120mで追いかけた。B君がA君に追いつくのは、B君が出発してから何分後か。", choices:["15分","20分","25分","30分"], answer:1, exp:"A君は10分で800m先行。速度差40m/分。800÷40=20分。" },
  { q:"池の周囲を1周する道のりは3.6kmである。この道のりを時速7.2kmで1周するのに何分かかるか。", choices:["20分","25分","30分","40分"], answer:2, exp:"3.6÷7.2=0.5時間=30分。" },
  { q:"上りは時速4km、下りは時速6kmで同じ道を往復した。往復にかかった時間の合計が5時間のとき、片道の距離は何kmか。", choices:["8km","10km","12km","15km"], answer:2, exp:"x/4+x/6=5より、5x/12=5、x=12km。" },
  { q:"長さ150mの列車が秒速25mで走るとき、長さ350mの鉄橋を渡り終えるまでに何秒かかるか。", choices:["14秒","18秒","20秒","25秒"], answer:2, exp:"走行距離=350+150=500m。500÷25=20秒。" }
]},
{ group:"非言語", id:"shugo", name:"集合", desc:"ベン図を使った集合の問題", questions:[
  { q:"ある学年の生徒40人にアンケートをとったところ、犬を飼っている人は18人、猫を飼っている人は15人、どちらも飼っていない人は12人だった。犬と猫の両方を飼っている人は何人か。", choices:["3人","5人","7人","10人"], answer:1, exp:"少なくとも一方を飼う人は40-12=28人。18+15-28=5人。" },
  { q:"生徒50人のうち、数学が得意な人は30人、英語が得意な人は25人、両方とも得意な人は12人いる。どちらも得意でない人は何人か。", choices:["5人","7人","9人","12人"], answer:1, exp:"少なくとも一方が得意な人は30+25-12=43人。50-43=7人。" },

const LAST_NICK_KEY = "spiAppLastNick_v1";

function loadDB(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveDB(db){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
}
function sanitizeKey(nickname){
  return encodeURIComponent(nickname.trim()).replace(/[.#$\[\]%]/g, "_");
}
function isOnlineSyncEnabled(){
  return !!FIREBASE.DB_URL;
}
async function fetchRemoteCategories(nickname){
  try{
    const key = sanitizeKey(nickname);
    const res = await fetch(`${FIREBASE.DB_URL}/students/${key}/categories.json`);
    if(!res.ok) return {};
    const data = await res.json();
    return data || {};
  }catch(e){ return {}; }
}
async function saveRemoteCategories(nickname, categories){
  try{
    const key = sanitizeKey(nickname);
    const res = await fetch(`${FIREBASE.DB_URL}/students/${key}/categories.json`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(categories)
    });
    return res.ok;
  }catch(e){ return false; }
}
/* 現在のカテゴリ別成績を取得する(オンライン同期が有効なら常にサーバーが正) */
async function getStats(nickname){
  if(isOnlineSyncEnabled()){
    const remote = await fetchRemoteCategories(nickname);
    const db = loadDB();
    db[nickname] = { categories: remote };
    saveDB(db); // オフライン閲覧用にローカルへもキャッシュ
    return remote;
  }
  const db = loadDB();
  return (db[nickname] && db[nickname].categories) || {};
}
async function recordResults(nickname, resultsArr){
  const current = await getStats(nickname);
  resultsArr.forEach(r=>{
    if(!current[r.catId]) current[r.catId] = { attempted:0, correct:0 };
    current[r.catId].attempted++;
    if(r.correct) current[r.catId].correct++;
  });
  const db = loadDB();
  db[nickname] = { categories: current };
  saveDB(db);
  if(isOnlineSyncEnabled()){
    await saveRemoteCategories(nickname, current);
  }
  return current;
}
function computeAnalysisFromCategories(cats){
  const arr = Object.keys(cats).map(id=>{
    const s = cats[id];
    return { id, name:(CAT_META[id]||{}).name || id, attempted:s.attempted, correct:s.correct, pct: Math.round((s.correct/s.attempted)*100) };
  }).filter(x=>x.attempted>0);
  const strong = arr.slice().sort((a,b)=> b.pct-a.pct || b.attempted-a.attempted).slice(0,3);
  const weak = arr.slice().sort((a,b)=> a.pct-b.pct || b.attempted-a.attempted).slice(0,3);
  return { hasData: arr.length>0, strong, weak };
}

/* ========================= アプリ本体 ========================= */
const app = document.getElementById("app");
let state = { nickname:"", questions:[], idx:0, answers:[], catLabel:"" };

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

/* ---- ログイン画面 ---- */
function renderLogin(){
  const lastNick = localStorage.getItem(LAST_NICK_KEY) || "";
  app.innerHTML = `
    <div class="login-wrap">
      <p class="lead">ニックネームを入力すると、解いた問題の結果が記録され、<br>あなたの得意・不得意を分析できるようになります。</p>
      <input type="text" id="nickInput" class="nick-input" placeholder="ニックネームを入力" maxlength="20" value="${escapeHtml(lastNick)}">
      <button class="enter-btn" id="enterBtn">入る</button>
      <div class="error-msg" id="loginError"></div>
      <div class="login-note">※ 個人が特定できるニックネームの使用は避けてください</div>
    </div>
  `;
  const input = document.getElementById("nickInput");
  const btn = document.getElementById("enterBtn");
  const err = document.getElementById("loginError");
  function submit(){
    const val = input.value.trim();
    if(!val){ err.textContent = "ニックネームを入力してください。"; return; }
    state.nickname = val;
    localStorage.setItem(LAST_NICK_KEY, val);
    renderMenu();
  }
  btn.addEventListener("click", submit);
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  input.focus();
}

/* ---- メニュー画面 ---- */
async function renderMenu(){
  app.innerHTML = `<div style="text-align:center; padding:50px 0; color:var(--ink-soft); font-size:13px;">読み込み中…</div>`;
  const categories = await getStats(state.nickname);
  const analysis = computeAnalysisFromCategories(categories);

  let analysisHtml = "";
  if(!analysis.hasData){
    analysisHtml = `<div class="analysis-empty">まだ記録がありません。問題を解くと、ここに得意・不得意な項目が表示されます。</div>`;
  } else {
    const row = x => `<div class="analysis-row"><span>${x.name}</span><span>${x.pct}%(${x.correct}/${x.attempted})</span></div>`;
    analysisHtml = `
      <div class="analysis-cols">
        <div class="analysis-col strong"><h4>得意な項目</h4>${analysis.strong.map(row).join("") || '<div class="analysis-empty">データ不足</div>'}</div>
        <div class="analysis-col weak"><h4>苦手な項目</h4>${analysis.weak.map(row).join("") || '<div class="analysis-empty">データ不足</div>'}</div>
      </div>`;
  }

  const syncNote = isOnlineSyncEnabled()
    ? "オンライン同期: 有効(どの端末でも同じ記録が見られます)"
    : "オンライン同期: 未設定(この端末のみに記録されます)";

  let html = `
    <div class="user-bar">
      <span>ニックネーム: <b>${escapeHtml(state.nickname)}</b><br><span style="font-size:10.5px;">${syncNote}</span></span>
      <button id="changeNickBtn">ニックネームを変更</button>
    </div>
    <div class="analysis-box">
      <div class="analysis-title">あなたの傾向</div>
      ${analysisHtml}
    </div>
    <div class="random-row">
      <button class="random-btn" id="randLang">言語ランダム(10問)</button>
      <button class="random-btn nonlang" id="randNonlang">非言語ランダム(10問)</button>
    </div>
  `;

  ["言語","非言語"].forEach(g=>{
    html += `<div class="group-title"><span class="tag">${g}</span>項目を選んでください</div><div class="cat-grid">`;
    QUIZ_DATA.filter(c=>c.group===g).forEach(c=>{
      const stat = categories[c.id];
      const statHtml = stat ? `直近までの正答率 ${Math.round((stat.correct/stat.attempted)*100)}%(${stat.correct}/${stat.attempted}問)` : "";
      html += `<button class="cat-btn" data-cat="${c.id}">
        <span class="name">${c.name}</span>
        <span class="desc">${c.desc}</span>
        ${statHtml ? `<span class="stat">${statHtml}</span>` : ""}
      </button>`;
    });
    html += `</div>`;
  });

  app.innerHTML = html;

  document.getElementById("changeNickBtn").addEventListener("click", renderLogin);
  document.getElementById("randLang").addEventListener("click", ()=>startQuiz({ group:"言語", random:true }));
  document.getElementById("randNonlang").addEventListener("click", ()=>startQuiz({ group:"非言語", random:true }));
  app.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>startQuiz({ catId: btn.dataset.cat }));
  });
}

/* ---- 出題開始 ---- */
function startQuiz(opts){
  let pool = [];
  let label = "";
  if(opts.random){
    QUIZ_DATA.filter(c=>c.group===opts.group).forEach(c=>{
      c.questions.forEach(q=> pool.push({ ...q, catId:c.id, catName:c.name }));
    });
    pool = shuffle(pool).slice(0,10);
    label = opts.group + "(ランダム)";
  } else {
    const cat = QUIZ_DATA.find(c=>c.id===opts.catId);
    pool = shuffle(cat.questions.map(q=>({ ...q, catId:cat.id, catName:cat.name })));
    label = cat.name;
  }
  state.questions = pool;
  state.idx = 0;
  state.answers = [];
  state.catLabel = label;
  renderQuiz();
}

/* ---- 出題画面 ---- */
function renderQuiz(){
  const total = state.questions.length;
  const q = state.questions[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const isLast = state.idx === total-1;

  app.innerHTML = `
    <div class="quiz-head">
      <span class="cat-label">${escapeHtml(state.catLabel)}</span>
      <span>${state.idx+1} / ${total} 問</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div><span class="q-number">${state.idx+1}</span></div>
    <div class="q-text">${escapeHtml(q.q)}</div>
    <div class="choices" id="choices">
      ${q.choices.map((c,i)=>`
        <button class="choice" data-i="${i}">
          <span class="bubble">${["A","B","C","D"][i]}</span>
          <span>${escapeHtml(c)}</span>
        </button>`).join("")}
    </div>
    <div class="select-warn" id="selectWarn"></div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="quitBtn">メニューに戻る</button>
      <button class="btn btn-primary" id="nextBtn">${isLast ? "回答を終了" : "次へ"}</button>
    </div>
  `;

  let chosen = null;
  const choiceBtns = app.querySelectorAll(".choice");
  choiceBtns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      chosen = parseInt(btn.dataset.i);
      choiceBtns.forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      document.getElementById("selectWarn").textContent = "";
    });
  });

  document.getElementById("nextBtn").addEventListener("click", async (e)=>{
    if(chosen === null){
      document.getElementById("selectWarn").textContent = "選択肢を選んでください。";
      return;
    }
    state.answers.push({
      q: q.q, choices:q.choices, chosen, correctIndex:q.answer,
      correct: chosen === q.answer, catId:q.catId, catName:q.catName, exp:q.exp
    });
    if(isLast){
      e.target.disabled = true;
      e.target.textContent = "採点しています…";
      await finishQuiz();
    } else {
      state.idx++; renderQuiz();
    }
  });

  document.getElementById("quitBtn").addEventListener("click", renderMenu);
}

async function finishQuiz(){
  await recordResults(state.nickname, state.answers.map(a=>({ catId:a.catId, correct:a.correct })));
  renderResult();
}

/* ---- 結果画面 ---- */
function renderResult(){
  const total = state.answers.length;
  const correctCount = state.answers.filter(a=>a.correct).length;

  app.innerHTML = `
    <div class="result-wrap">
      <div class="stamp">
        <div class="score-num">${correctCount}<span style="font-size:16px">/${total}</span></div>
        <div class="score-word">CHECKED</div>
      </div>
      <div class="result-cat">「${escapeHtml(state.catLabel)}」正解数 ${correctCount}/${total}</div>
      <div class="result-actions">
        <button class="btn btn-primary" id="backMenuBtn">メニューに戻る</button>
      </div>
      <div class="review-list">
        ${state.answers.map((a,i)=>`
          <div class="review-item">
            <div class="review-head">
              <span class="mark ${a.correct ? 'ok' : 'ng'}">${a.correct ? '○' : '×'}</span>
              <span class="qlabel">問${i+1}${state.catLabel.indexOf("ランダム")>-1 ? "（"+a.catName+"）" : ""}</span>
            </div>
            <div class="review-q">${escapeHtml(a.q)}</div>
            <div class="review-ans">
              <span class="you">あなたの回答: ${["A","B","C","D"][a.chosen]}. ${escapeHtml(a.choices[a.chosen])}</span><br>
              正解: ${["A","B","C","D"][a.correctIndex]}. ${escapeHtml(a.choices[a.correctIndex])}
            </div>
            <div class="review-exp">${escapeHtml(a.exp)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  document.getElementById("backMenuBtn").addEventListener("click", renderMenu);
}

renderLogin();
</script>
</body>
</html>
